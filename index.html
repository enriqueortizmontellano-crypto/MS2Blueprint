<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MS2 Blueprint — UPR SOM</title>

    <!-- Tailwind (CDN build, no compile step needed) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: {
                900: '#0f2438',
                800: '#16344f',
                700: '#1d4566',
                600: '#27567d',
              },
              teal: {
                600: '#0d9488',
                500: '#14b8a6',
              },
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- React + ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel standalone: lets the browser transform JSX on the fly, no build step -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script>
      // Force the CLASSIC JSX runtime. The default "automatic" runtime emits
      // `import { jsx } from "react/jsx-runtime"`, which cannot run in a classic
      // <script> tag and leaves the page blank.
      Babel.registerPreset("react-classic", {
        presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
      });
    </script>

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic" src="./siteData.js?v=gh10"></script>
    <script type="text/babel" data-presets="react-classic" src="./Icons.jsx?v=gh10"></script>
    <script type="text/babel" data-presets="react-classic" src="./Collapsible.jsx?v=gh10"></script>
    <script type="text/babel" data-presets="react-classic" src="./Checklist.jsx?v=gh10"></script>
    <script type="text/babel" data-presets="react-classic" src="./Layout.jsx?v=gh10"></script>
    <script type="text/babel" data-presets="react-classic" src="./GlobalMethod.jsx?v=gh10"></script>
    <script type="text/babel" data-presets="react-classic" src="./BlockPage.jsx?v=gh10"></script>
    <script type="text/babel" data-presets="react-classic" src="./IB1.jsx?v=gh10"></script>
    <script type="text/babel" data-presets="react-classic" src="./IB2.jsx?v=gh10"></script>
    <script type="text/babel" data-presets="react-classic" src="./IB3.jsx?v=gh10"></script>
    <script type="text/babel" data-presets="react-classic" src="./App.jsx?v=gh10"></script>
  </body>
</html>
